services:
  # Backend Service (Node.js App)
  backend:
    image: mrunknownde/utools-backend
    container_name: utools_backend
    restart: unless-stopped
    user: "0"   # Run as root so ASN cache volume is writable
    environment:
      NODE_ENV: production
      PORT: 3000
      LOG_LEVEL: info
      PING_COUNT: 4
      SENTRY_DSN: "https://7ea70caba68f548fb96482a573006a7b@o447623.ingest.us.sentry.io/4509062020333568"
      # ASN Cache directory (filesystem persistence across restarts)
      ASN_CACHE_DIR: /app/asn-cache
      # MaxMind GeoLite2 auto-update (downloaded + refreshed daily by the backend
      # itself, see backend/geoipUpdater.js) — set these in a local .env file or
      # the deploying shell's environment, never commit real values here
      MAXMIND_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:?Set MAXMIND_ACCOUNT_ID (see backend/example.env)}
      MAXMIND_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:?Set MAXMIND_LICENSE_KEY (see backend/example.env)}
      # Speedtest on the /diagnose page — opt-in per deployment (see backend/example.env)
      SPEEDTEST_ENABLED: "true"
      SPEEDTEST_MAX_DOWNLOAD_MB: 25
      SPEEDTEST_MAX_UPLOAD_MB: 25
    volumes:
      # Persistent ASN lookup cache — survives container restarts
      - asn_cache:/app/asn-cache
      # Persistent MaxMind GeoLite2 databases — survives container restarts/
      # redeploys so the backend doesn't have to re-download on every restart
      - geoip_data:/app/data
    dns:
      - 1.1.1.1
      - 1.0.0.1
      - 8.8.8.8
      - 8.8.4.4
    networks:
      - utools_network

  # Frontend Service (Nginx)
  frontend:
    image: mrunknownde/utools-frontend
    container_name: utools_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - utools_network

networks:
  utools_network:
    driver: bridge

# Named volumes — persist across container restarts
volumes:
  asn_cache:
    driver: local
  geoip_data:
    driver: local
